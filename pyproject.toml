[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "socialblade-cli"
version = "1.2.0"
description = "Unified Social Blade & Cross-Platform Creator Growth CLI with 3-tier provider engine, historical post engagement & timeline correlation, 5-year Holt's Linear projections, and SQLite SSOT time-series ledger"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Vec Yang" }
]
keywords = ["socialblade", "youtube", "tiktok", "instagram", "twitch", "twitter", "creator-analytics", "cli"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.40.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
socialblade = "socialblade_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
